<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Horários | RG CAR - Especialista Automotivo</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-red: #ce1111;
            --dark-surface: rgba(15, 15, 15, 0.95);
            --dark-bg: #000000;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--dark-bg); 
            color: #ffffff;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=2000');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }

        .brand-name {
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 900;
            font-style: italic;
            letter-spacing: -4px;
            line-height: 0.9;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .brand-rg { color: #ffffff; }
        .brand-car { color: var(--primary-red); }

        .list-card {
            background-color: var(--dark-surface);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1.5rem;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.9);
            max-height: 500px;
            overflow-y: auto;
        }

        .list-card::-webkit-scrollbar { width: 6px; }
        .list-card::-webkit-scrollbar-track { background: transparent; }
        .list-card::-webkit-scrollbar-thumb { background: rgba(206, 17, 17, 0.3); border-radius: 10px; }

        .status-pill {
            font-size: 0.7rem;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 80px;
            text-align: center;
        }

        .bg-livre { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.2); }
        .bg-ocupado { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .bg-manutencao { background: rgba(243, 156, 18, 0.1); color: #f39c12; border: 1px solid rgba(243, 156, 18, 0.2); }

        .status-badge {
            background-color: rgba(0, 0, 0, 0.8);
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dot-pulse { width: 10px; height: 10px; border-radius: 50%; }
        .dot-online { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }
        .dot-offline { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body class="pb-20">

    <header class="pt-16 pb-8 text-center px-6">
        <div class="max-w-5xl mx-auto">
            <div class="mb-6 inline-block bg-red-600/10 p-4 rounded-full border border-red-600/20">
                <i class="fa-solid fa-screwdriver-wrench text-3xl text-red-600"></i>
            </div>
            <h1 class="brand-name">
                <span class="brand-rg">RG</span> <span class="brand-car">CAR</span>
            </h1>
            <p class="text-zinc-400 font-medium tracking-widest mt-2 uppercase text-sm">Auto Mecânica</p>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 mt-2 relative">
        <div class="flex items-center justify-between mb-8 px-2">
            <div>
                <h2 id="tituloAgenda" class="text-xl font-black text-white uppercase tracking-tighter italic">Status da Agenda</h2>
                <div class="h-1 w-16 bg-red-600 mt-1"></div>
            </div>
            <div id="statusContainer" class="status-badge">
                <span id="statusDot" class="dot-pulse"></span>
                <span id="statusText" class="text-white text-[11px] font-black uppercase tracking-widest">Verificando...</span>
            </div>
        </div>

        <div class="list-card">
            <div id="lista-horarios" class="divide-y divide-white/5">
                <div class="p-10 text-center text-zinc-500">
                    <i class="fa-solid fa-circle-notch animate-spin text-2xl mb-4"></i>
                    <p class="uppercase font-bold tracking-widest text-xs">Sincronizando oficina...</p>
                </div>
            </div>
        </div>

        <div class="mt-10 text-center">
            <button onclick="copiarEAbrirZap()" class="inline-flex items-center gap-4 bg-green-600 hover:bg-green-500 text-white font-black py-5 px-10 rounded-2xl transition-all uppercase tracking-widest text-sm shadow-2xl active:scale-95 w-full md:w-auto justify-center">
                <i class="fa-brands fa-whatsapp text-2xl"></i> 
                <span id="textoBotao">Agendar: 84 98717-1946</span>
            </button>
            <p class="text-zinc-500 text-[10px] uppercase tracking-[5px] mt-4 font-black">Toque para copiar e abrir</p>
        </div>
    </main>

    <footer class="mt-20 py-10 text-center bg-black/80 border-t border-white/5">
        <p class="text-zinc-500 text-[9px] uppercase tracking-[10px] font-black mb-2">RG CAR MECÂNICA AUTOMOTIVA</p>
        <div class="flex flex-col md:flex-row justify-center items-center gap-4 text-zinc-400 text-sm mt-4">
            <span class="flex items-center"><i class="fa-solid fa-location-dot text-red-600 mr-2"></i> Rua Oeste Reffesa Nº 8</span>
            <span class="flex items-center"><i class="fa-solid fa-clock text-red-600 mr-2"></i> Seg - Sáb</span>
        </div>
    </footer>

    <script>
        const NUMERO_ZAP = "5584987171946"; 

        async function carregarAgenda() {
            try {
                const response = await fetch('status_oficina.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error();
                const dados = await response.json();
                
                const agora = new Date();
                const diaSemana = agora.getDay(); 
                const horaAtual = agora.getHours();
                let dataParaExibir = new Date();
                let textoTitulo = "Agenda de Hoje";

                if ((diaSemana === 6 && horaAtual >= 12) || diaSemana === 0) {
                    let diasParaSomar = (diaSemana === 6) ? 2 : 1;
                    dataParaExibir.setDate(agora.getDate() + diasParaSomar);
                    textoTitulo = "Agenda de Segunda";
                } else if (horaAtual >= 18) {
                    dataParaExibir.setDate(agora.getDate() + 1);
                    textoTitulo = "Agenda de Amanhã";
                }

                document.getElementById('tituloAgenda').innerText = textoTitulo;

                const dataFormatada = dataParaExibir.toLocaleDateString('pt-BR');
                const horariosFiltrados = dados.filter(item => item.Data === dataFormatada);

                const container = document.getElementById('lista-horarios');
                container.innerHTML = '';

                if (horariosFiltrados.length === 0) {
                    const msg = `Nenhum horário definido para ${dataParaExibir.toLocaleDateString('pt-BR', {weekday: 'long'})}`;
                    container.innerHTML = `<div class="p-10 text-center text-zinc-600 font-bold text-xs tracking-widest uppercase">${msg}</div>`;
                    return;
                }

                horariosFiltrados.sort((a, b) => a.Hora.localeCompare(b.Hora));

                // LÓGICA DE INTELIGÊNCIA: Agrupar blocos OCUPADOS respeitando o almoço e intervalos
                const itensProcessados = [];
                let blocoOcupado = null;

                horariosFiltrados.forEach((item, index) => {
                    const statusAtual = item.Status.toLowerCase();
                    const horaInt = parseInt(item.Hora.split(':')[0]);

                    if (statusAtual === 'ocupado') {
                        if (!blocoOcupado) {
                            blocoOcupado = { data: item.Data, inicio: item.Hora, fim: item.Hora, status: "Ocupado" };
                        } else {
                            const horaAnterior = parseInt(blocoOcupado.fim.split(':')[0]);
                            
                            // QUEBRA O BLOCO SE:
                            // 1. A diferença for maior que 1 hora (intervalo livre no meio)
                            // 2. Passar das 12h vindo da manhã (trava do almoço)
                            if ((horaInt - horaAnterior > 1) || (horaInt >= 13 && horaAnterior <= 12)) {
                                itensProcessados.push(blocoOcupado);
                                blocoOcupado = { data: item.Data, inicio: item.Hora, fim: item.Hora, status: "Ocupado" };
                            } else {
                                blocoOcupado.fim = item.Hora;
                            }
                        }
                    } else {
                        if (blocoOcupado) {
                            itensProcessados.push(blocoOcupado);
                            blocoOcupado = null;
                        }
                        itensProcessados.push({ data: item.Data, inicio: item.Hora, fim: null, status: item.Status });
                    }
                });
                if (blocoOcupado) itensProcessados.push(blocoOcupado);

                // Renderização
                itensProcessados.forEach(item => {
                    const statusClass = item.status.toLowerCase();
                    const exibicaoHora = item.fim && item.inicio !== item.fim 
                        ? `${item.inicio} às ${item.fim}` 
                        : item.inicio;

                    const div = document.createElement('div');
                    div.className = 'p-6 flex justify-between items-center hover:bg-white/[0.02] transition-all';
                    div.innerHTML = `
                        <div class="flex flex-col">
                            <span class="text-zinc-500 text-[10px] font-black uppercase tracking-widest mb-1">${item.data}</span>
                            <span class="text-white text-xl font-black">${exibicaoHora}</span>
                        </div>
                        <div class="status-pill bg-${statusClass}">${item.status}</div>
                    `;
                    container.appendChild(div);
                });

            } catch (error) {
                document.getElementById('lista-horarios').innerHTML = '<div class="p-10 text-center text-zinc-600 font-bold text-xs tracking-widest">ERRO AO SINCRONIZAR</div>';
            }
        }

        function copiarEAbrirZap() {
            const btnLabel = document.getElementById('textoBotao');
            const originalText = "Agendar: 84 98717-1946";

            navigator.clipboard.writeText("84987171946").then(() => {
                btnLabel.innerText = "NÚMERO COPIADO!";
                setTimeout(() => {
                    window.location.href = `https://wa.me/${NUMERO_ZAP}?text=Olá RG CAR! Vi os horários no site e quero agendar um serviço.`;
                    setTimeout(() => { btnLabel.innerText = originalText; }, 2000);
                }, 800);
            });
        }

        function atualizarStatusOficina() {
            const agora = new Date();
            const dia = agora.getDay();
            const hora = agora.getHours();
            let aberto = (dia >= 1 && dia <= 5 && hora >= 8 && hora < 18) || (dia === 6 && hora >= 8 && hora < 12);
            document.getElementById('statusDot').className = aberto ? 'dot-pulse dot-online' : 'dot-pulse dot-offline';
            document.getElementById('statusText').innerText = aberto ? 'Oficina Aberta' : 'Oficina Fechada';
            document.getElementById('statusText').style.color = aberto ? '#22c55e' : '#ef4444';
        }

        window.onload = () => {
            carregarAgenda();
            atualizarStatusOficina();
            setInterval(carregarAgenda, 10000);
            setInterval(atualizarStatusOficina, 60000);
        };
    </script>
</body>
</html>
